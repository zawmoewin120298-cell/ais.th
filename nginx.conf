worker_processes auto;
events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    default_type text/html;
    resolver 8.8.8.8 1.1.1.1 ipv6=off;
    resolver_timeout 10s;

    # ============= Buffers & Performance =============
    client_body_buffer_size 512k;
    client_max_body_size 0;

    proxy_buffer_size  64k;
    proxy_buffers 16 64k;
    proxy_busy_buffers_size 128k;
    proxy_temp_file_write_size 256k;
    proxy_max_temp_file_size 0;

    large_client_header_buffers 8 32k;
    client_header_buffer_size 16k;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 120s;
    keepalive_requests 1000;

    server_tokens off;

    # ============= Cache =============
    proxy_cache_path /cache levels=1:2
        keys_zone=zone_1:10m
        max_size=1g
        inactive=60m
        use_temp_path=off;

    # ============= WebSocket Upgrade Map =============
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ============= Global Proxy Headers =============
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Online-Host $host;
    proxy_set_header X-Forward-Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $request_method;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Ssl $https;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Referer $http_referer;
    proxy_set_header Accept-Encoding $http_accept_encoding;
    proxy_set_header Accept-Language $http_accept_language;

    proxy_set_header Cache-Control $http_cache_control;
    proxy_set_header Pragma $http_pragma;

    proxy_set_header X-Request-ID $request_id;

    # ============= Redirect & Cookie =============
    proxy_redirect https://true.th/ https://true.th;
    proxy_cookie_domain true.th $host;
    proxy_cookie_path / /;

    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    proxy_hide_header X-AspNet-Version;

    proxy_ignore_headers Set-Cookie Cache-Control Expires;

    # ============= Upstreams =============
    upstream xray_ws_backend {
        server 127.0.0.1:10001;
        keepalive 32;
        keepalive_timeout 60s;
        keepalive_requests 1000;
    }

    upstream xray_xhttp_backend {
        server 127.0.0.1:10002;
        keepalive 64;
        keepalive_timeout 60s;
        keepalive_requests 1000;
    }

    # =============================================
    # Server: Port 8080
    # =============================================
    server {
        listen 8080 default_server;
        http2 on;
        server_name true.th bbr.trueth.kdns.fr _;

        # ============= Security Headers =============
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ============= Health Check =============
        location = /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # ============= VPN WebSocket =============
        # ✅ ပြင်ပြီး - = ဖျက်ထားတယ်
        location /vpn-ws {
            proxy_pass http://xray_ws_backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Online-Host $host;
            proxy_set_header X-Forward-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Referer $http_referer;
            proxy_set_header X-Request-ID $request_id;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 120s;

            proxy_buffer_size 256k;
            proxy_buffers 8 256k;
            proxy_busy_buffers_size 512k;
            proxy_max_temp_file_size 0;

            proxy_buffering off;
            proxy_request_buffering off;
            tcp_nodelay on;
            tcp_nopush off;
            proxy_socket_keepalive on;

            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # ============= VPN XHTTP =============
        # ✅ ပြင်ပြီး - = ဖျက်ထားတယ်
        location /vpn-xhttp {
            proxy_pass http://xray_xhttp_backend;
            proxy_http_version 1.1;

            # XHTTP needs Connection: "" (empty) for keepalive
            proxy_set_header Connection "";

            # Standard headers
            proxy_set_header Host $host;
            proxy_set_header X-Online-Host $host;
            proxy_set_header X-Forward-Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Referer $http_referer;
            proxy_set_header X-Request-ID $request_id;

            # CRITICAL for XHTTP: pass all custom X-Xray-Xhttp-* headers
            proxy_pass_request_headers on;
            proxy_pass_request_body on;

            # Long-lived session timeouts
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 120s;

            # Streaming (no buffering)
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;

            tcp_nodelay on;
            tcp_nopush off;
            chunked_transfer_encoding on;
            proxy_socket_keepalive on;

            # Disable caching for VPN traffic
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }

        # ============= Static Website =============
        location /website/ {
            alias /usr/local/openresty/nginx/html/;
            index index.html;
            try_files $uri $uri/ =404;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        # ============= Camouflage Reverse Proxy =============
        location / {
            resolver 8.8.8.8 1.1.1.1 ipv6=off;
            resolver_timeout 10s;

            proxy_ssl_server_name on;
            proxy_ssl_name true.th;
            proxy_ssl_verify off;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            proxy_pass https://true.th;

            proxy_set_header Host true.th;
            proxy_set_header X-Online-Host $host;
            proxy_set_header X-Forward-Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Ssl $https;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
            proxy_set_header Referer $http_referer;
            proxy_set_header Accept-Encoding $http_accept_encoding;
            proxy_set_header Accept-Language $http_accept_language;

            proxy_set_header Cache-Control $http_cache_control;
            proxy_set_header Pragma $http_pragma;
            proxy_set_header X-Request-ID $request_id;

            proxy_redirect http://true.th/ https://true.th/;
            proxy_cookie_domain true.th $host;
            proxy_cookie_path / /;

            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            proxy_ignore_headers Set-Cookie Cache-Control Expires;

            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;

            proxy_cache zone_1;
            proxy_cache_key "$scheme$proxy_host$request_uri";
            proxy_cache_valid 200 302 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_methods GET HEAD POST;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Proxy-Server "NGINX" always;

            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ============= Error Pages =============
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/local/openresty/nginx/html;
            internal;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
