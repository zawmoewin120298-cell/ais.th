# Cloudflare IP Scanner Config
# Lowest latency IP ကို auto ရွေးပါမယ်

# ─── VLESS Settings ───────────────────────────────────
vless:
  uuid: "f55ce6cc-3f6b-40fc-9e3b-abe26db17009"
  domain: "bbr.trueth.kdns.fr"      # SNI / Host (ပြောင်းလို့မရ)
  port: 443
  path: "/vpn-xhttp"
  mode: "auto"
  security: "tls"
  insecure: true

# ─── Scan Settings ────────────────────────────────────
settings:
  timeout: 2                        # seconds (TLS handshake timeout)
  samples: 3                        # latency တိုင်းတဲ့ အကြိမ်အရေအတွက်
  max_workers: 100                  # concurrent scan threads
  top_n: 5                          # Top N IP ကို log မှာ ပြ
  config_file: "config.json"
  outbound_tag: "auto"              # Selector tag
  server_outbound_tag: "cf-ip"      # Server update လုပ်ရမယ့် outbound
  log_file: "scanner.log"

# ─── Cloudflare IP List ───────────────────────────────
# ဒီ list ကို auto update လုပ်နိုင်တယ် (အောက်မှာ ပြ)
