# ============================================
# Squid Proxy → Xray HTTP Inbound
# ============================================

http_port 3128

# Xray HTTP inbound ကို upstream အနေနဲ့ သုံး
cache_peer 127.0.0.1 parent 1080 0 no-query default
never_direct allow all

# Cache မလိုဘူး (VPN အတွက်)
cache deny all
cache_mem 0 MB

# Log
access_log /var/log/squid/access.log
cache_log /var/log/squid/cache.log

# ============================================
# ✅ IP Whitelist — ဆရာ့ IP ပဲ ခွင့်ပြု
# ============================================
# ⚠️ အောက်က IP ကို ဆရာ့ IP နဲ့ အစားထိုးပါ
acl allowed_ips src 1.2.3.4/32
acl allowed_ips src 5.6.7.8/32

# ============================================
# Ports
# ============================================
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 8080
acl CONNECT method CONNECT

# ============================================
# Access Rules (အစဉ်လိုက် အရေးကြီး)
# ============================================
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Whitelist IP တွေပဲ ခွင့်ပြု
http_access allow allowed_ips

# ကျန်တာ အားလုံး ပိတ်
http_access deny all

# ============================================
# DNS & Privacy
# ============================================
dns_nameservers 8.8.8.8 1.1.1.1
visible_hostname proxy
via off
forwarded_for delete

# Performance
pconn_timeout 60 seconds
read_timeout 15 minutes
request_timeout 5 minutes
