name: Auto Subdomain Check

on:
  schedule:
    - cron: "*/15 * * * *"   # ၁၅ မိနစ်တစ်ခါ run
  workflow_dispatch:          # manual run လုပ်နိုင်တယ်

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run switcher
        run: python src/switcher.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/
          git diff --staged --quiet || git commit -m "chore: auto update best subdomain"
          git push
